<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="weather-app" class="data">

        <h1>Weather App</h1>

        <!-- Search -->
        <div class="search-box">
            <input type="text" placeholder="Enter city name">
            <button>Search</button>
        </div>

        <!-- Weather Information -->
        <div class="weather-card">

            <h2>Karachi</h2>
            <p class="date">Friday, September 4</p>

            <div class="weather-icon">☀️</div>

            <h3>32°C</h3>
            <p class="condition">Sunny</p>

            <div class="details">

                <div>
                    <span>💧</span>
                    <p>Humidity</p>
                    <strong>55%</strong>
                </div>

                <div>
                    <span>💨</span>
                    <p>Wind</p>
                    <strong>18 km/h</strong>
                </div>

                <div>
                    <span>🌡️</span>
                    <p>Feels Like</p>
                    <strong>35°C</strong>
                </div>

            </div>

        </div>

        <!-- Forecast -->
        <h2 class="forecast-title">5 Days Forecast</h2>

        <div class="forecast">

            <div class="day">
                <p>Sat</p>
                <span>☀️</span>
                <strong>33°C</strong>
            </div>

            <div class="day">
                <p>Sun</p>
                <span>🌤️</span>
                <strong>31°C</strong>
            </div>

            <div class="day">
                <p>Mon</p>
                <span>🌧️</span>
                <strong>29°C</strong>
            </div>

            <div class="day">
                <p>Tue</p>
                <span>⛅</span>
                <strong>30°C</strong>
            </div>

            <div class="day">
                <p>Wed</p>
                <span>☀️</span>
                <strong>34°C</strong>
            </div>

        </div>

    </div>
<script src="app.js"></script>
</body>
</html>
